name: Wandr
options:
  bundleIdPrefix: com.mediabeam
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # the Gradle build script writes outside the sandbox
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64   # shared is built for arm64 only (no iosX64 target)
targets:
  Wandr:
    type: application
    platform: iOS
    sources:
      - path: Wandr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediabeam.fitness
        PRODUCT_NAME: Wandr
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Kotlin/Native framework produced by :shared:embedAndSignAppleFrameworkForXcode
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework shared"
    info:
      path: Wandr/Info.plist
      properties:
        CFBundleDisplayName: WANDR
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: WANDR uses your location to record your outdoor activities.
        NSLocationAlwaysAndWhenInUseUsageDescription: WANDR uses your location to keep recording your activity while the screen is off.
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  Wandr:
    build:
      targets:
        Wandr: all
    run:
      config: Debug
    archive:
      config: Release
