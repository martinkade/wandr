name: Wandr
options:
  bundleIdPrefix: com.mediabeam
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # the Gradle build script writes outside the sandbox
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64   # shared is built for arm64 only (no iosX64 target)
targets:
  Wandr:
    type: application
    platform: iOS
    sources:
      - path: Wandr
    dependencies:
      - target: WandrWatch   # embedded in Wandr.app/Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediabeam.fitness
        PRODUCT_NAME: Wandr
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Kotlin/Native framework produced by :shared:embedAndSignAppleFrameworkForXcode
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework shared"
    entitlements:
      path: Wandr/Wandr.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        aps-environment: development
    info:
      path: Wandr/Info.plist
      properties:
        CFBundleDisplayName: WANDR
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - remote-notification
        NSHealthShareUsageDescription: WANDR reads your workouts from Apple Health so that activities recorded with other apps appear in your history. Access is read-only.
        NSCameraUsageDescription: WANDR uses the camera to take your profile photo.
        NSLocationWhenInUseUsageDescription: WANDR uses your location to record your outdoor activities.
        NSLocationAlwaysAndWhenInUseUsageDescription: WANDR uses your location to keep recording your activity while the screen is off.
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  WandrWatch:
    type: application
    platform: watchOS
    sources:
      - path: WandrWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mediabeam.fitness.watchkitapp
        PRODUCT_NAME: WandrWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    entitlements:
      path: WandrWatch/WandrWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: WandrWatch/Info.plist
      properties:
        CFBundleDisplayName: WANDR
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mediabeam.fitness
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: WANDR reads your heart rate and distance during a workout to show live values and save the workout.
        NSHealthUpdateUsageDescription: WANDR saves your workouts and routes to Apple Health.
        NSLocationWhenInUseUsageDescription: WANDR uses your location to record the route of your outdoor workout.
  WandrWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: WandrWatchTests
    dependencies:
      - target: WandrWatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mediabeam.fitness.watchkitapp.tests
schemes:
  Wandr:
    build:
      targets:
        Wandr: all
    run:
      config: Debug
    archive:
      config: Release
  WandrWatch:
    build:
      targets:
        WandrWatch: all
    test:
      targets:
        - WandrWatchTests
    run:
      config: Debug
    archive:
      config: Release
